note = """ICE/SEVP administers F-1 practical training, so the operative STEM OPT rules
live here rather than in 8 CFR. Critically for founders: self-employment is barred (a
student cannot sign their own Form I-983), but working at a start-up you founded IS
permitted where a bona fide employer-employee relationship exists, the entity is
E-Verify enrolled, and compensation is commensurate with similarly situated U.S.
workers. That nuance appears nowhere in Title 8."""
