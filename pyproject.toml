[project]
name = "visa-rag"
version = "0.1.0"
description = "Local, offline, citation-gated research over primary U.S. immigration sources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "certifi>=2024.8",
    "numpy>=1.26",
    "prompt-toolkit>=3.0",
    "pyarrow>=15.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=4.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
visa = "visa.cli:app"
visa-app = "visa.app:main"

[project.optional-dependencies]
app = [
    "pywebview>=6.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visa"]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 90
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/visa"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow.*", "pypdf.*", "webview.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
