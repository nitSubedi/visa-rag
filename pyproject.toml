[project]
name = "visa-rag"
version = "0.1.0"
description = "Local, offline, citation-gated research over primary U.S. immigration sources"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "prompt_toolkit>=3",
    "numpy>=1.26",
    "pyarrow>=15",
    "pypdf>=4",
    "certifi",
]

[project.scripts]
visa = "visa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visa"]
