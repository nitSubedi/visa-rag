# Provisions that are published in the corpus but not in force.
#
# The eCFR publishes regulations as amended and encodes nothing about litigation. A
# nationwide injunction therefore leaves the corpus simultaneously current and wrong,
# with every freshness signal green — see STATE.md finding 11. This register is the only
# thing standing between that and an answer quoting enjoined law confidently.
#
# Entries are per *provision*, never per rule: a court can enjoin part of a rulemaking
# and leave the rest in force, which is exactly what happened below.
#
# Maintained by hand because "which provisions does this order enjoin, and for whom" is
# legal judgment that no docket API returns. Automation may alert a maintainer; it must
# never write an entry. A wrong entry is a wrong legal claim.
#
# `checked` is load-bearing. Staleness here is dangerous in BOTH directions: a lifted
# injunction leaves a false warning, a new one leaves no warning at all.

[[entry]]
provisions = [
  # Sections the rule rewrote. With fingerprints below, these only scope the match —
  # a chunk is withheld when it CONTAINS an amended paragraph, never merely because it
  # sits in one of these sections. Registering whole paragraphs by hand withheld the
  # in-force STEM OPT rules (E-Verify, unemployment limits), which the rule never touched.
  "8 CFR 214.1",
  "8 CFR 214.2(f)",
  "8 CFR 214.2(i)",
  "8 CFR 214.2(j)",
  # Missed until 2026-09-29: the rule also amends 248.1 and 274a.12. Its amendatory
  # instructions (FR Doc. 2026-14439, 91 FR 44976) list exactly four sections — 214.1,
  # 214.2, 248.1, 274a.12. 248.1(g) is NOT here: the rule only relettered it from (e),
  # word for word, so its text is in force.
  "8 CFR 248.1(e)",
  "8 CFR 248.1(f)",
  "8 CFR 274a.12(b)",
  "8 CFR 274a.12(c)",
]
# The paragraphs the rule added or rewrote, in full, found by diffing the 2026-08-21 and
# 2026-09-18 eCFR editions with `scripts/register_diff.py --full` — not typed from memory.
# 118 paragraphs: 214.1(a)(b)(c)(m); 214.2(f) 57, (i) 17, (j) 19. Full text rather than
# openings because redaction removes each paragraph by its exact span. None of the amended
# 214.2(f) paragraphs carries E-Verify, unemployment, Form I-983 or bona fide employment
# text. 214.2(h) also changed between those editions — a different rule, excluded.
# Plus 5 paragraphs outside 214, from the same diff run over all of Title 8 and checked
# against the rule's amendatory instructions: 248.1(e) (the 4-year cap on readmission)
# and (f) (abandonment of change of status), and 274a.12(b)(6)(v), (b)(10), (c)(3)(iii)
# (the 240-day limit). The other sections that changed in that window — fees, e-filing,
# public charge, persons born to foreign government employees — are other rules.
amended = [
  "(4) Requirements for admission of aliens under section 101(a)(15)(F) and (J). Aliens applying for admission as F or J nonimmigrants after September 15, 2026, will be inspected and may be admitted into the United States, if in possession of a valid Form I-20 or Form DS-2019, or successor form, and otherwise eligible, and subject to the following:",
  "(i) Aliens applying for admission as F nonimmigrants. (A) Aliens seeking admission to the United States, including those seeking admission with a properly filed pending application for an extension of stay, as an F nonimmigrant after a previously authorized period of admission as an F nonimmigrant expired, may be admitted for a maximum period of 4 years or the length of program as specified on Form I-20, whichever is shorter, plus additional 30 day periods for arrival and departure as provided in § 214.2(f)(5)(i);",
  "(B) Aliens seeking admission to the United States as an F nonimmigrant with a properly filed pending application for extension of stay as an F nonimmigrant may, if they have time remaining on the period of stay authorized prior to departure, be admitted for a period up to the unexpired period of stay authorized prior to the alien's departure, plus an additional 30 days as provided in § 214.2(f)(5)(v), subject to the requirements in paragraph (c)(8) of this section, or if the alien seeks admission with a Form I-20 for a program end date beyond their previously authorized period of admission, the alien may be admitted for the period specified in § 214.2(f)(5), subject to the requirements in paragraph (c)(8) of this section; and",
  "(C) Aliens seeking admission to the United States as an F nonimmigrant with an approved extension of stay for F nonimmigrant status may be admitted until the expiration of the approved extension of stay, plus an additional 30 days, as provided in § 214.2(f)(5)(v).",
  "(ii) Aliens applying for admission as J nonimmigrants. (A) Aliens seeking admission to the United States, including those seeking admission with a properly filed, pending application for an extension of stay as a J nonimmigrant after a previously authorized period of admission as a J nonimmigrant expired, may be admitted for the period specified in § 214.2(j)(1)(ii);",
  "(B) Aliens seeking admission to the United States as a J nonimmigrant with a properly filed pending extension of stay as a J nonimmigrant may, if they have time remaining on the period of stay authorized prior to departure, be admitted for a period up to the unexpired period of stay authorized prior to the alien's departure, plus an additional 30 days as provided in § 214.2(j)(1)(ii)(C), subject to the requirements in paragraph (c)(8) of this section, provided that if the alien seeks admission with a Form DS-2019 for a program end date beyond his or her previously authorized period of admission, the alien may be admitted for the period specified in § 214.2(j)(1), subject to the requirements in paragraph (c)(8) of this section; and",
  "(C) Aliens seeking admission to the United States as a J nonimmigrant with an approved extension of stay in J nonimmigrant status may be admitted up to the expiration of the approved extension of stay, plus an additional 30 days as provided in § 214.2(j)(1)(ii)(C).",
  "(iii) Post-completion optional practical training (OPT) and Science, Technology, Engineering and Mathematics (STEM) OPT extension. Aliens seeking admission to the United States as an F nonimmigrant to pursue post-completion OPT or a STEM OPT extension may be admitted until the end date of the approved employment authorization for post-completion OPT or STEM OPT, or if the Application for Employment Authorization, Form I-765 (or successor form) for post-completion OPT or STEM OPT is still pending with USCIS, as evidenced by a notice issued by USCIS indicating receipt of such application, until the Designated School Official's recommended employment end date for post-completion OPT or STEM OPT specified on the Form I-20, subject to the requirements in paragraphs (c)(8) of this section and 8 CFR 274a.12(b)(6)(iv), plus a 30-day period as provided in § 214.2(f)(5)(v).",
  "(b) Admission of nonimmigrants under section 101(a)(15)(F), (J), or (M) whose visa validity is considered automatically extended to complete unexpired periods of previous admission or extension of stay—(1) Section 101(a)(15)(F). The inspecting immigration officer may admit, up to the unexpired period of stay authorized prior to the alien's departure, any nonimmigrant alien whose nonimmigrant visa validity is considered automatically extended pursuant to 22 CFR 41.112(d) and who is applying for admission under section 101(a)(15)(F) of the Act, if the alien:",
  "(2) Section 101(a)(15)(J). The inspecting immigration officer may admit, up to the unexpired period of stay authorized prior to the alien's departure, any nonimmigrant alien whose nonimmigrant visa validity is considered automatically extended pursuant to 22 CFR 41.112(d) and who is applying for admission under section 101(a)(15)(J) of the Act, if the alien:",
  "(3) Section 101(a)(15)(M). The inspecting immigration officer may admit, up to the unexpired period of stay authorized prior to the alien's departure, any nonimmigrant alien whose nonimmigrant visa validity is considered automatically extended pursuant to 22 CFR 41.112(d) and who is applying for admission under section 101(a)(15)(M) of the Act, if the alien:",
  "(2) Filing for an extension of stay. Any other nonimmigrant who seeks to extend his or her stay beyond the currently authorized period of admission must apply for an extension of stay by filing an extension request in the manner and on the form prescribed by USCIS, together with the required fees and all initial evidence specified in the applicable provisions of § 214.2, and in the form instructions, including the submission of any biometrics required by 8 CFR 103.16. More than one person may be included in an application if the co-applicants are all members of a single-family unit and either all hold the same nonimmigrant status, or one holds a nonimmigrant status, and the other co-applicants are his or her spouse and/or children who hold derivative nonimmigrant status based on his or her status. Extensions granted to members of a family unit must be for the same period of time. The shortest period granted to any member of the family will be granted to all members of the family. In order to be eligible for an extension of stay, nonimmigrant aliens in K-3/K-4 status must do so in accordance with § 214.2(k)(10).",
  "(v) Any nonimmigrant admitted for duration of status, except those who fall under paragraph (m) of this section;",
  "(8) Abandonment of extension of stay and pending employment authorization applications for F, I, and J nonimmigrant aliens. (i) If an alien in F, I, or J nonimmigrant status timely files an application for an extension of stay, USCIS will not consider the application abandoned if the alien departs the United States while the application is pending, provided that when the alien seeks admission, the previously authorized period of admission has not expired, and the alien seeks admission for the balance of the previously authorized admission period.",
  "(ii) An application for extension of stay in F, I, or J nonimmigrant status may be deemed abandoned if an alien departs the United States and seeks admission with a Form I-20 or DS-2019 for a program end date beyond their previously authorized period of admission while the application for an extension of stay is pending. USCIS will not consider as abandoned any corresponding applications for employment authorization.",
  "(iii) When an alien described in paragraph (c)(8)(i) or (ii) of this section departs, the alien should travel with a copy of their Form I-797C, Notice of Action, or successor form, which confirms the receipt of either their Form I-539, Application to Extend/Change Nonimmigrant Status, or Form I-765, Application for Employment Authorization, along with proposed length of stay as evidenced by the Form I-20, DS-2019, or letter of employment for a foreign media organization.",
  "(m) Transition period from duration of status to a fixed admission date—(1) Transition from duration of status admission to a fixed admission period for aliens properly maintaining F and J status on September 15, 2026. Aliens with F or J status who are properly maintaining their status on September 15, 2026, and who were admitted for duration of status are authorized to remain in the United States in F or J nonimmigrant status until the later date of either the expiration date on an Employment Authorization Document, Form I-766, or successor form, or the program end date noted on their Form I-20 or Form DS-2019, as applicable, not to exceed a period of 4 years from September 15, 2026, plus the departure period of 60 days for F nonimmigrants, which is November 14, 2030, and 30 days for J nonimmigrants, which is October 15, 2030. Subject to 8 CFR 274a.14, any authorized employment or training continues until the program end date on such F or J nonimmigrant's Form I-20 or DS-2019, as applicable and as endorsed by the designated school official or responsible officer for employment or training, or expiration date on the alien's Employment Authorization Document, Form I-766, or successor form. Aliens who need additional time to complete their current program of study, including requests for post-completion optional practical training (OPT) and the Science, Technology, Engineering and Mathematics (STEM) OPT extension, or exchange visitor program, including academic training, or would like to start a new program of study or exchange visitor program must apply for an extension of stay with USCIS in accordance with paragraph (c)(2) of this section for an admission period to a fixed date.",
  "(i) Notwithstanding this paragraph (m)(1), an F-1 student recommended for post-completion OPT who files before his or her period of admission expires, including the 60 day departure period, an Application for Employment Authorization, Form I-765, or successor form on the form and in the manner designated by USCIS, with the required fee, as described in the form's instructions, on or before March 18, 2027, is not required to file an Application to Extend/Change Nonimmigrant Status, Form I-539, or successor form for the requested period of post-completion OPT. An F-1 student recommended for STEM OPT who files, prior to the expiration of his or her current OPT Employment Authorization Document, Form I-766, or successor form, an Application for Employment Authorization, Form I-765, or successor form on or before March 18, 2027, is not required to file an Application to Extend/Change Nonimmigrant Status, Form I-539, or successor form for the requested period of STEM OPT. If the alien's application for post-completion OPT or STEM OPT employment authorization is approved, the alien will be authorized to remain in the United States in F status until the expiration date of the Employment Authorization Document, plus 60 days. If the employment authorization application is denied, the F-1 student would continue to be authorized to remain in the United States until the program end date listed on their Form I-20, valid on September 15, 2026, plus 60 days, as long as he or she continues to pursue a full course of study and otherwise meets the requirements for F-1 status, or until the end date of the Employment Authorization Document for post-completion OPT, as long as he or she continues to meet the requirements for F-1 status, plus 60 days.",
  "(ii) An F-1 student described in this paragraph (m)(1) who departs the United States before filing the application for post-completion OPT or STEM OPT, and is admitted to the United States with a fixed period of admission is required to file both an Application for Employment Authorization, Form I-765, or successor form and an Application to Extend/Change Nonimmigrant Status, Form I-539, or successor form pursuant to § 214.2(f)(11)(i)(B)(2) or (f)(11)(i)(C). An alien described in this section who departs the United States while the Application for Employment Authorization, Form I-765, or successor form is pending or once approved will be admitted pursuant to paragraph (a) of this section.",
  "(iii) DHS reserves the discretion to extend the period exempting the filing of the Application to Extend/Change Nonimmigrant Status, Form I-539, or successor form beyond March 18, 2027, in 6-month increments by publication of a notification in the Federal Register.",
  "(2) Pending employment authorization applications with USCIS on September 15, 2026, filed by F-1 students. F-1 students described in paragraph (m)(1) of this section who have timely and properly filed applications for employment authorization pending with USCIS on September 15, 2026, do not have to file for an extension or re-file such applications for employment authorization, unless otherwise requested by USCIS.",
  "(i) If the F-1 student's application for post-completion OPT or STEM OPT employment authorization is approved, the F-1 student will be authorized to remain in the United States in F status until the expiration date of the Employment Authorization Document, plus 60 days. If the employment authorization application is denied, the F-1 student would continue to be authorized to remain in the United States until the program end date listed on their Form I-20, plus 60 days, as long as he or she continues to pursue a full course of study and otherwise meets the requirements for F-1 status.",
  "(ii) F-1 students with pending employment authorization applications, other than post-completion OPT and STEM OPT, who continue to pursue a full course of study and otherwise meet the requirements for F-1 status, continue to be authorized to remain in the United States until the program end date listed on the Form I-20, plus 60 days, regardless of whether the employment authorization application is approved or denied.",
  "(3) Transition from duration of status admission to a fixed admission period for aliens with I status present in the United States on September 15, 2026. Except for those aliens described in § 214.2(i)(3)(ii), aliens in I nonimmigrant status who are properly maintaining their status on September 15, 2026, and who were admitted for duration of status are authorized to remain in the United States in I nonimmigrant status for a period necessary to complete their activity, not to exceed May 13, 2027, with the exception of aliens in I nonimmigrant status presenting with passports described in § 214.2(i)(3)(ii), who are authorized to remain in the United States in I nonimmigrant status for a period necessary to complete their activity, not to exceed December 14, 2026. Aliens who need additional time to complete their employment beyond May 13, 2027, or December 14, 2026, as applicable, must apply for an extension of stay with USCIS in accordance with paragraph (c)(2) of this section and § 214.2(i)(5).",
  "(4) Severability. The provisions in this paragraph (m) are intended to be independent severable parts. In the event that any provision in this paragraph (m) is not implemented, DHS intends that the remaining provisions be implemented as an independent rule.",
  "(5) Period of stay—(i) General. An F-1 student is admitted for a fixed period of time, which is the period necessary to complete the course of study indicated on the Form I-20, or successor form, not to exceed a period of 4 years, plus additional times noted in this paragraph (f)(5)(i). A continuing F-1 student may be granted additional time to complete their program of study, as described in paragraphs (f)(7) and (f)(8)(iv) of this section, begin a new program of study, as described in paragraphs (f)(5)(ii)(D) and (f)(7) of this section, or following the completion of studies to engage in post-completion optional practical training (OPT) and the Science, Technology, Engineering and Mathematics (STEM) extension of OPT, as described in paragraph (f)(5)(i)(D) of this section. An F-1 student described in this section may be admitted for a period of up to 30 days before the indicated report date or program start date listed on the Form I-20 or successor form. An alien described in this paragraph (f)(5)(i) may remain in the United States for an additional 30 days as provided in paragraph (f)(5)(v) of this section. The 30-day period before the indicated report date or program start date and 30 additional days following the program end date or the 4-year maximum period of admission do not count toward the maximum length of stay. The admission periods described in this paragraph (f)(5)(i) are subject to the following exceptions:",
  "(A) F-1 students whose course of study is in an English language training program are restricted to a maximum of admission period of 24 months, plus an additional 30-day period of stay for the purposes of departure or to otherwise seek to maintain lawful status.",
  "(B) Border commuter students under the provisions in paragraph (f)(18) of this section may be admitted for the applicable period described under paragraph (f)(18).",
  "(C) F-1 students attending a public high school, which may also include a charter school or other similar school funded by U.S. taxpayers, are restricted to an aggregate of no more than 12 months to complete their course of study, including any school breaks and annual vacations.",
  "(D) Students with pending employment authorization applications who are admitted based on the designated school official's recommended employment end date for post-completion OPT or STEM OPT as specified on their Form I-20, with a notice issued by USCIS indicating receipt of the Application for Employment Authorization, Form I-765, or successor form for post-completion OPT or STEM OPT, who cease employment pursuant to an Employment Authorization Document (EAD) that expires before the alien's fixed date of admission as noted on their Arrival/Departure Record, Form I-94, or successor form, will be considered to be in the United States in a period of authorized stay from the date of the expiration noted on their EAD until the fixed date of admission as noted on their Form I-94.",
  "(E) The authorized period of stay for F-2 dependents may not exceed the authorized period of stay of the principal F-1 student.",
  "(ii) School transfer and change of educational objectives. (A) An F-1 student at any level below the graduate degree level may not transfer or change educational objectives, i.e., majors or educational levels, within the first academic year of a program of study, unless an exception is authorized by SEVP for extenuating circumstances that may include, but are not limited to, a school closure or a school's prolonged inability to hold in-person classes due to a natural disaster, a student needing to change schools to complete elementary or secondary education, or other cause. An F-1 student at the graduate degree level or above may not change educational objectives at any point during their program of study. An F-1 student at the graduate degree level or above may not transfer at any point during their program of study, unless an exception is authorized by SEVP for extenuating circumstances that may include, but are not limited to, a school closure or a school's prolonged inability to hold in-person classes due to a natural disaster or other cause.",
  "(B) An F-1 student who has completed a program in the United States at one educational level and begins a new program at a higher educational level is considered to be maintaining F-1 status if otherwise complying with requirements under this paragraph (f).",
  "(C) An alien who has completed a program after September 15, 2026, in the United States as an F-1 student at one educational level may not maintain, be admitted, or otherwise be provided F-1 status through a program at the same educational level or a lower educational level.",
  "(D) When seeking a change in educational objectives, F-1 students referenced in paragraphs (f)(5)(ii)(A) through (C) of this section must, if seeking an extension of stay, apply for an extension of stay on the form designated by USCIS, with the required fee and in accordance with the form instructions, including any biometrics required by 8 CFR 103.16.",
  "(E) Until September 14, 2028, DHS may delay or suspend the implementation of paragraphs (f)(5)(ii)(A) through (C) of this section, in its discretion, if it determines that implementation is infeasible for any reason. If DHS delays or suspends any provisions in paragraphs (f)(5)(ii)(A) through (C) governing the change in educational objectives, DHS will make an announcement of the delay or suspension by publication of a notification in the Federal Register and on SEVP's website at https://www.studyinthestates.dhs.gov (or successor uniform resource locator). DHS thereafter will announce the implementation dates of a delayed or suspended educational objective provision on the SEVP website at https://www.studyinthestates.dhs.gov (or successor uniform resource locator), at least 30 calendar days in advance.",
  "(iii) Report date on Form I-20 or successor form. When determining the report date on the Form I-20 or successor form, the designated school official may choose a reasonable date to accommodate a student's need to be in attendance for required activities at the school prior to the actual start of classes. Such required activities may include, but are not limited to, research projects and orientation sessions. However, for purposes of employment, the designated school official may not indicate a report date more than 30 days prior to the start of classes.",
  "(iv) Annual vacation. An F-1 student at an academic institution is considered to be in status during the annual (or summer) vacation if the student is eligible and intends to register for the next term. A student attending a school on a quarter or trimester calendar who takes only one vacation a year during any one of the quarters or trimesters instead of during the summer is considered to be in status during that vacation, if the student has completed the equivalent of an academic year prior to taking the vacation.",
  "(v) Period of preparation for departure or to otherwise maintain lawful status in the United States. An F-1 student who has completed a course of study and any authorized practical training will be allowed an additional 30-day period from the program end date or the 4 year maximum period of admission, or the end date of the approved employment authorization for post-completion OPT or STEM OPT, as applicable, to prepare for departure from the United States, or to otherwise seek to maintain lawful status, including timely filing an extension of stay application in accordance with paragraph (f)(7) of this section and § 214.1 or timely filing a change of status application in accordance with 8 CFR 248.1(a). The 30-day period will be reflected on the F-1 student's Arrival/Departure Record, Form I-94, or successor form. However, if the F-1 student ends his or her study or training prior to expiration of his or her period of admission, the F-1 student, and any eligible dependents, must, within 30 days from the end date of the study or training, depart the United States or otherwise seek to maintain lawful status. An F-1 student authorized by the designated school official to withdraw from classes will be allowed a 15-day period from the date of the withdrawal to depart the United States. An F-1 student who fails to maintain a full course of study or otherwise fails to maintain status is not eligible for any additional period of time for departure and must leave the country immediately.",
  "(vi) Emergent circumstances as determined by the Secretary. Where the Secretary has suspended the applicability of any or all of the requirements for on-campus or off-campus employment authorization for specified students pursuant to paragraphs (f)(9)(i) or (ii) of this section by notice in the Federal Register, an affected student who needs to reduce their full course of study as a result of accepting employment authorized by such notice in the Federal Register will be considered to be in status during the authorized employment, subject to any other conditions specified in the notice, provided that, for the duration of the authorized employment, the student is registered for the number of semester or quarter hours of instruction per academic term specified in the notice, which in no event shall be less than six semester or quarter hours of instruction per academic term if the student is at the undergraduate level or less than three semester or quarter hours of instruction per academic term if the student is at the graduate level, and is continuing to make progress toward completing the course of study.",
  "(vii) Extension of status and grant of employment authorization. (A) The status, and any employment authorization granted under 8 CFR 274a.12(c)(3)(i)(B) or (C), of an F-1 student who is the beneficiary of an H-1B petition subject to section 214(g)(1)(A) of the Act (8 U.S.C. 1184(g)(1)(A)) requesting a change of status will be automatically extended until April 1 of the fiscal year for which such H-1B status is being requested or until the validity start date of the approved petition, whichever is earlier, where such petition:",
  "(B) The automatic extension of an F-1 student's status and employment authorization under paragraph (f)(5)(vii)(A) of this section shall automatically terminate upon the rejection, denial, revocation, or withdrawal of the H-1B petition filed on such F-1 student's behalf, or upon the denial or withdrawal of the request for change of nonimmigrant status, even if the H-1B petition filed on the F-1 student's behalf is approved for consular processing.",
  "(C) In order to obtain the automatic extension of stay and employment authorization under paragraph (f)(5)(vii)(A) of this section, the F-1 student, consistent with 8 CFR part 248, must not have violated the terms or conditions of his or her nonimmigrant status.",
  "(D) An automatic extension of an F-1 student's status under paragraph (f)(5)(vii)(A) of this section also applies to the status of any F-2 dependent aliens.",
  "(viii) Automatic extension of the authorized period of stay and employment authorization while extension of stay and employment authorization applications are pending. An F-1 student whos1e status as indicated on the Arrival/Departure Record, Form I-94, or successor form has expired will be considered to be in a period of authorized stay if he or she has timely filed an extension of stay application pursuant to paragraph (f)(7) of this section until USCIS issues a decision on the extension of stay application. Subject to paragraphs (f)(9)(i) and (ii) and (f)(10)(i) of this section and 8 CFR 274a.12(b)(6)(i) and (iii) and (c)(3)(iii), an F-1 student's current on-campus, curricular practical training (CPT), and severe economic hardship authorized employment is automatically extended during the pendency of the extension of stay application, but such automatic extension may not exceed 240 days beginning from the end date of his or her period of admission as indicated on the alien's Arrival/Departure Record, Form I-94, or successor form. However, severe economic hardship employment authorization resulting from emergent circumstances under paragraph (f)(5)(vi) of this section is automatically extended for up to 240 days or until the end date stated in the Federal Register notification announcing the suspension of certain requirements, whichever is earlier. If an F-1 student files an extension of stay application during the 30-day period provided in paragraph (f)(5)(v) of this section, he or she does not receive an automatic extension of authorized employment, including on-campus, CPT, and severe economic hardship, and must wait for approval of the extension of stay application (and employment authorization application, if required) before engaging in CPT or employment. For purposes of employment eligibility verification (Form I-9) under 8 CFR 274a.2(b)(1)(v), for CPT under paragraph (f)(10)(i) of this section, on-campus employment under paragraph (f)(9)(i) of this section, and severe economic hardship employment authorization resulting from emergent circumstances under paragraph (f)(5)(vi) of this section, the alien's authorized employment period, which ends 30 days before their Form I-94 or successor form admit until date, or Employment Authorization Document, Form I-766 or successor form, based on severe economic hardship, when combined with a notice issued by USCIS indicating receipt of an extension of stay application, is considered unexpired for up to 240 days or until USCIS issues a decision on the extension of stay application, or for CPT, until the CPT end date authorized by the designated school official on the Form I-20 or successor form, whichever is earlier, or for severe economic hardship employment based on emergent circumstances under paragraph (f)(5)(vi) of this section, the end date stated in the Federal Register notification announcing suspension of certain requirements, whichever is less.",
  "(7) Extension of stay—(i) Eligibility. USCIS may grant an extension of stay to an F-1 student who has maintained his or her F-1 status, but who is unable to complete his or her program by the end of his or her authorized period of admission. Such student may be eligible for an extension if the designated school official issues a new Form I-20 or successor form certifying that the student is eligible under this paragraph (f)(7)(i). An F-1 student may be granted an extension if it is established that the student:",
  "(A) Has continually maintained lawful status;",
  "(B) Is currently pursuing a full course of study; and",
  "(C) Has one of the following:",
  "(1) A currently issued Form I-20, or successor form, indicating additional time is left to complete his or her program of study; or",
  "(2) Documentation demonstrating the request for an extension is based on one of the following reasons:",
  "(i) A compelling academic reason, such as a change of major or research topic or unexpected research problems. Unexpected research problems are those caused by an unexpected change in faculty advisor, need to refine an investigatory topic based on initial research, research funding delays, and similar issues. Delays including, but not limited to, those caused by academic probation or suspension or a student's repeated inability or unwillingness to complete his or her course of study are not acceptable reasons for an extension;",
  "(ii) A documented illness or medical condition that is a compelling medical reason, such as a serious injury, that is supported by medical documentation from a licensed medical doctor, a licensed doctor of osteopathy, a licensed psychologist, or a licensed clinical psychologist; or",
  "(iii) Circumstances beyond the student's control, including a natural disaster, national health crisis, or the closure of an institution.",
  "(ii) SEVIS update. The Form I-20 or successor form must be endorsed with the designated school official recommendation and new program end date for submission to USCIS.",
  "(iii) USCIS application—(A) Form. An F-1 student must file an extension of stay application using the form and in the manner designated by USCIS, including submitting the updated, properly endorsed Form I-20 or successor form; submitting evidence of sufficient funds to cover expenses; appearing for any biometrics collection required by 8 CFR 103.16; and remitting the appropriate fee. The F-1 student must be maintaining his or her status and must never have engaged in any unauthorized employment.",
  "(B) Timely filing. An extension of stay application is considered timely filed if the receipt date, pursuant to 8 CFR 103.2(a)(7), is on or before the date the authorized period of stay expires, which includes the 30-day period provided in paragraph (f)(5)(v) of this section. USCIS must receive the extension application on or before the expiration of the authorized period of stay, including the 30-day period provided in paragraph (f)(5)(v) of this section that is allowed after the completion of studies or any authorized practical training. If the extension of stay application is received during the 30-day period provided in paragraph (f)(5)(v) of this section, the F-1 student is authorized to continue a full course of study but may not continue or begin engaging in practical training or other employment. Notwithstanding § 214.1(c)(4), USCIS must receive the extension of stay application on or before the expiration of the previously authorized period of stay.",
  "(iv) Dependents. An F-2 spouse and unmarried children under the age of 21 seeking to accompany the principal F-1 student during the additional period of admission must either be included on the principal F-1 student's application for an extension of stay or file their own extension of stay application on the form designated by USCIS. The application must be submitted using the form and in the manner designated by USCIS, including submitting the updated, properly endorsed Form I-20, or successor form; submitting evidence of sufficient funds to cover expenses; appearing for any biometrics collection required by 8 CFR 103.16; and remitting the appropriate fee. The F-2 dependents must demonstrate the qualifying relationship with the principal F-1 student, be maintaining his or her status, and must not have engaged in any unauthorized employment.",
  "(v) Practical training. If seeking an extension of stay to engage in any type of practical training, the alien in F-1 status also must have a valid, properly endorsed Form I-20 and be eligible to receive the specific type of practical training requested.",
  "(vi) Period of stay. If an application for extension is granted, the F-1 student and the student's F-2 spouse and children, if applicable, are to be given an extension of stay for the period of time necessary to complete the program as listed on the F-1 student's Form I-20, or successor form, or requested practical training, not to exceed 4 years. The 30-day period before the indicated report date or program start date and 30 additional days following the program end date or the 4-year maximum period of admission do not count toward the maximum length of an extension. Extensions of stay for F-2 dependents may not exceed the authorized admission period of the principal F-1 student.",
  "(vii) Denials. If an F-1 student's extension of stay application is denied and the F-1 student's authorized admission period has expired, the F-1 student and his or her dependents must immediately depart the United States.",
  "(viii) Late requests of extension of current program end date. If the designated school official enters an extension of the program end date in SEVIS after the end date noted on the most recent Form I-20 or successor form has passed, the F-1 student must file a request for reinstatement of F-1 status in the manner and on the form designated by USCIS, with the required fee, including any biometrics required by 8 CFR 103.16. F-2 dependents seeking to accompany the F-1 principal student must file applications for an extension of stay or reinstatement, as applicable.",
  "(8) School transfer and change of educational objectives—(i) Eligibility. An F-1 student may change educational objectives or transfer to SEVP-certified schools if he or she is maintaining status as described in paragraphs (f)(5)(ii)(A) through (D) of this section. “Educational objectives” refers to an F-1 student's educational level or major. An F-1 student changing educational objectives or transferring to an SEVP-certified school also must meet the following requirements:",
  "(A) The student is currently maintaining status;",
  "(B) To be eligible to transfer, the student must:",
  "(1) Have been pursuing a full course of study, unless a reduced course load was properly authorized under this paragraph (f);",
  "(2) Have completed a degree program; or",
  "(3) Be currently completing or have completed post-completion or STEM optional practical training (OPT);",
  "(C) The student is not currently in a graduate level program of study, unless an exception has been authorized by SEVP for extenuating circumstances under paragraph (f)(5)(ii)(A) of this section;",
  "(D) The student has completed his or her first academic year of a program of study at the school that initially issued his or her Form I-20 or successor form, unless an exception has been authorized by SEVP for extenuating circumstances under paragraph (f)(5)(ii)(A) of this section;",
  "(E) The student has not been placed on academic probation or school suspension;",
  "(F) The student does not have a pattern of behavior demonstrating a repeated inability or unwillingness to complete his or her course of study;",
  "(G) The student will begin classes at the transfer school or program within 5 months of transferring out of the current school or within 5 months of the program completion date on his or her current Form I-20, or successor form, whichever is earlier; and",
  "(H) If the F-1 student is authorized to engage in post-completion or STEM OPT, he or she must be able to begin or resume classes within 5 months of transferring out of the school that recommended the post-completion or STEM OPT or the date the post-completion or STEM OPT authorization ends, whichever is earlier.",
  "(ii) Transfer procedure. An F-1 student must first notify the student's current school (“transfer-out school”) of the intent to transfer and indicate the school to which the student intends to transfer (the “transfer-in school”). Upon notification by the student, the transfer-out school will update the student's record in SEVIS as a “transfer-out” and indicate the transfer-in school and a release date. The release date will be the current semester or session completion date, or the date of expected transfer if earlier than the completion date of the established academic cycle. The transfer-out school will retain control over the student's record in SEVIS until the student completes the current term or reaches the release date, whichever is earlier. At the request of the student, the designated school official of the current school may cancel the transfer request at any time prior to the release date. As of the release date specified by the current designated school official, the transfer-in school will be granted full access to the student's SEVIS record and then becomes responsible for that student. The student should then obtain a valid Form I-20 or successor form from the transfer-in school.",
  "(iii) Change of education level procedures. A change of education level can be accomplished according to the transfer procedures outlined in paragraph (f)(8)(ii) of this section.",
  "(iv) Extension of stay. If the new program to which the student transferred will not be completed within the authorized period of stay established in paragraph (f)(5)(i) of this section, the F-1 student must apply to USCIS for an extension of stay in the manner and using the form designated by USCIS, with the required fee and in accordance with form instructions, including any biometrics required by 8 CFR 103.16, together with a valid, properly endorsed Form I-20 or successor form indicating the new program end date. Upon approval of the extension of stay application, USCIS will transmit the approval to SEVIS. If the application is denied, the student is out of status, and the student's record must be terminated in SEVIS.",
  "(D) Extension of stay for post-completion optional practical training (OPT). Unless described in § 214.1(m)(1)(i), an F-1 student recommended for post-completion OPT must apply for an employment authorization and either apply for an extension of stay with USCIS or seek admission through CBP after travel abroad and may not engage in post-completion OPT unless such employment authorization is granted. If the application for post-completion OPT is granted along with an extension of stay or admission through CBP after travel abroad, the student extension will include the additional 30-day period provided in paragraph (f)(5)(v) of this section for departure following the expiration of the time approved to complete post-completion OPT.",
  "(2) Post-completion OPT. For post-completion OPT, not including a 24-month OPT extension under paragraph (f)(10)(ii)(C)(2) of this section, the student may properly file his or her Form I-765 or successor form up to 90 days prior to his or her program end date and no later than 30 days after his or her program end date. The student must also file his or her Form I-765 or successor form with USCIS within 30 days of the date the DSO enters the recommendation for OPT into his or her SEVIS record.",
  "(D) Start of OPT employment. A student may not begin OPT employment prior to the approved start date on his or her Employment Authorization Document, Form I-766 or successor form, except as described in paragraph (f)(11)(i)(C) of this section. A student may not request a start date that is more than 30 days after the student's program end date. Employment authorization will begin on the date requested or the date the employment authorization is adjudicated, whichever is later.",
  "(iii) Period of admission. An F-1 nonimmigrant student who is admitted as a border commuter student under this paragraph (f)(18) will be admitted until a date certain. The DSO is required to specify a completion date on the Form I-20 that reflects the actual semester or term dates for the commuter student's current term of study. A new Form I-20 will be required for each new semester or term that the border commuter student attends at the school. The provisions of paragraphs (f)(5) and (f)(7) of this section, relating to extension of stay, are not applicable to a border commuter student.",
  "(20) Severability. The provisions in paragraph (f) of this section are intended to be independent severable parts. In the event that any provision in this paragraph (f) is not implemented, DHS intends that the remaining provisions be implemented as an independent rule.",
  "(i) Representatives of information media—(1) Foreign media organization. A foreign information media organization is an organization engaged in the regular gathering, production, or dissemination via print, radio, television, internet distribution, or other media, of journalistic information and has a home office in a foreign country.",
  "(2) Evidence. Aliens applying for I nonimmigrant status must:",
  "(i) Demonstrate that the foreign media organization that the alien represents has a home office in a foreign country, and that the home office will continue to operate in the foreign country while the alien is in the United States; and",
  "(ii) Provide a letter from the employing foreign media organization or, if self-employed or freelancing, an attestation from the alien, that verifies the employment, establishes that the alien is a representative of that media organization, and describes the remuneration and work to be performed.",
  "(3) Admission—(i) Length of admission. Generally, aliens seeking admission in I nonimmigrant status may be admitted for a period of time necessary to complete the planned activities or assignments consistent with the I classification, not to exceed 240 days unless paragraph (i)(3)(ii) of this section applies.",
  "(ii) Foreign nationals travelling on a passport issued by the People's Republic of China (with the exception of Hong Kong Special Administrative Region passport holders and Macau Special Administrative Region passport holders). An alien who presents a passport from the People's Republic of China (with the exception of Hong Kong Special Administrative Region passport holders and Macau Special Administrative Region passport holders), may be admitted until the activities or assignments consistent with the I classification are completed, not to exceed 90 days.",
  "(4) Change in activity. Aliens admitted pursuant to section 101(a)(15)(I) of the Act may not change the information medium or employer until they obtain permission from USCIS. Aliens must request permission by submitting the form designated by USCIS, in accordance with that form's instructions, and with the required fee, including any biometrics required by 8 CFR 103.16, as appropriate.",
  "(5) Extensions of stay—(i) Eligibility; effect of timely filing. (A) Aliens in I nonimmigrant status may be eligible for extensions of stay, each of up to 240 days or until the activities or assignments consistent with the I classification are completed, whichever is shorter (except for aliens who present a passport from the People's Republic of China, with the exception of Hong Kong Special Administrative Region passport holders and Macau Special Administrative Region passport holders, who may be eligible for extensions of stay, each up to 90 days or until the activities or assignments consistent with the I classification are completed, whichever is shorter).",
  "(B) To request an extension of stay, aliens in I nonimmigrant status must file an application to extend their stay by submitting the form designated by USCIS, in accordance with that form's instructions, and with the required fee, including any biometrics required by 8 CFR 103.16, and provide all the evidence required in paragraph (i)(2) of this section, as appropriate. An alien whose I nonimmigrant status, as indicated on the alien's Arrival/Departure Record, Form I-94, has expired but who has timely filed an extension of stay application is authorized to continue engaging in activities consistent with the I classification on the day after the Form I-94 expired, for a period of up to 240 days, as provided in 8 CFR 274a.12(b)(20). Such authorization shall be subject to any conditions and limitations of the initial authorization.",
  "(C) If an extension of stay application remains pending at the end of this 240-day period, the I nonimmigrant alien, whose status has expired, may remain in the United States so long as the extension of stay application is pending, he or she has timely filed a subsequent extension of stay request to remain beyond the period requested in the preceding request, and he or she does not otherwise violate the terms of his or her authorized period of stay. The alien, however, must cease working until his or her initial extension of stay application is approved. USCIS will deny the extension of stay application if the alien did not cease working after the 240-day period and before the extension of stay request was approved.",
  "(ii) Dependents accompanying or following to join the principal I representative of foreign information media. A spouse or unmarried children under the age of 21 of an alien in I nonimmigrant status may be eligible for extensions of stay. The dependent applicant must either be included on the primary applicant's request for an extension of stay or file his or her own extension of stay application on the form designated by USCIS in accordance with paragraph (i)(5)(i) or (iii) of this section. The dependents must demonstrate the qualifying relationship with the principal I representative of foreign information media, be maintaining status, and must not have engaged in any unauthorized employment. Extensions of stay for I dependents may not exceed the authorized admission period of the principal I representative of foreign information media.",
  "(iii) Aliens with a passport from People's Republic of China. (A) In the case of an alien who presents a passport issued by the People's Republic of China (other than a Hong Kong Special Administrative Region passport or a Macau Special Administrative Region passport), an extension of stay may be authorized until the activities or assignments consistent with the I classification are completed, not to exceed the maximum period of stay of 90 days. To request an extension of stay, these aliens must file an application to extend their stay by submitting the form designated by USCIS, in accordance with that form's instructions, and with the required fee, including any biometrics required by 8 CFR 103.16, as appropriate. Notwithstanding paragraph (i)(5)(i) of this section and 8 CFR 274a.12(b)(20), an alien in I nonimmigrant status who is described in paragraph (i)(3)(ii) of this section whose status, as indicated on the alien's Arrival/Departure Record, Form I-94, has expired but who has timely filed an extension of stay application is authorized to continue engaging in activities consistent with the I classification and continue employment with the same employer on the day after the status indicated on the Form I-94 expired, for a period of up to 90 days. Such authorization shall be subject to any conditions and limitations of the initial authorization.",
  "(B) If an extension of stay application remains pending at the end of this 90-day period, the I nonimmigrant alien, whose status has expired, may remain in the United States so long as the extension of stay application is pending, he or she has timely filed a subsequent extension of stay request to remain beyond the period requested in the preceding request, and he or she does not otherwise violate the terms of his or her authorized period of stay. The alien, however, must cease working until his or her initial extension of stay application is approved. USCIS may deny the extension of stay application if the alien did not cease working after the 90-day period and before the extension of stay request was approved.",
  "(iv) Documentation. The facially expired Arrival/Departure Record, Form I-94, or successor form of an alien described in paragraphs (i)(5)(i) through (iii) of this section is considered unexpired when combined with a USCIS receipt notice indicating receipt of a timely filed extension of stay application. An application is considered timely filed if the receipt notice for the application is on or before the date the admission period expires. Such extension may not exceed the earlier of 240 days (90 days for aliens who present a passport issued by the People's Republic of China (with the exception of Hong Kong Special Administrative Region passport holders and Macau Special Administrative Region passport holders)) as provided in 8 CFR 274a.12(b)(20), or the date of denial of the alien's application for an extension of stay.",
  "(6) Denials. If an alien's extension of stay application is denied and the alien's authorized admission period has expired, the alien and his or her dependents must immediately depart the United States.",
  "(7) Change of status. An alien seeking to change from a different nonimmigrant status to, if eligible, an I nonimmigrant status as described in this section, may be granted a period of stay until the activities or assignments consistent with the I classification are completed, not to exceed the maximum period of stay stated in paragraph (i)(3) of this section. To request a change from a different nonimmigrant status to an I nonimmigrant status as described in this section, an alien must file an application to change his or her status by submitting the form designated by USCIS, in accordance with that form's instructions, and with the required fee, including any biometrics required by 8 CFR 103.16, as appropriate.",
  "(8) Severability. The provisions in this paragraph (i) are intended to be independent severable parts. In the event that any provision in this paragraph (i) is not implemented, DHS intends that the remaining provisions be implemented as an independent rule.",
  "(j) Exchange visitors—(1) General—(i) Eligibility for admission. A nonimmigrant exchange visitor and his or her accompanying spouse and minor children may be admitted into the United States in J-1 and J-2 classifications under section 101(a)(15)(J) of the Act, if the exchange visitor and his or her accompanying spouse and children each presents a SEVIS Form DS-2019 issued in his or her own name by a program approved by the Department of State for participation by J-1 exchange visitors. Prior to August 1, 2003, if exigent circumstances are demonstrated, the Service will allow the dependent of an exchange visitor possessing a SEVIS Form DS-2019 to enter the United States using a copy of the exchange visitor's SEVIS Form DS-2019. However, where the exchange visitor presents a properly completed Form DS-2019, Certificate of Eligibility for Exchange Visitor (J-1) Status, which was issued to the J-1 exchange visitor by a program approved by the Department of State for participation by exchange visitors and which remains valid for the admission of the exchange visitor, the accompanying spouse and children may be admitted on the basis of the J-1's non-SEVIS Form DS-2019.",
  "(ii) Admission period and period of stay—(A) J-1 exchange visitor. A J-1 exchange visitor may be admitted for the duration of the exchange visitor program, as stated by the program end date noted on Form DS-2019 or successor form, not to exceed a period of 4 years.",
  "(B) J-2 accompanying dependents. The authorized period of initial admission for a J-2 spouse and unmarried children under the age of 21 may not exceed the period of authorized admission of the principal J-1 exchange visitor.",
  "(C) Period of stay. A J-1 exchange visitor and J-2 spouse and unmarried children under the age of 21 may be admitted for a period up to 30 days before the report date or start of the approved program listed on Form DS-2019 or successor form. The dependents accompanying a J-1 exchange visitor are eligible for admission in J-2 status if the exchange visitor is admitted in J-1 status. A J-1 exchange visitor and J-2 accompanying dependents may remain in the United States for a period of 30 days from the program end date or the 4-year maximum period of admission, whichever is earlier, for the purposes of departure or to otherwise seek to maintain lawful status. The 30-day period will be reflected on the alien's Arrival/Departure Record, Form I-94 or successor form. If the program end date is shortened, the J-1 exchange visitor and any J-2 accompanying dependents must leave the United States within 30 days from the new program end date or otherwise seek to maintain lawful status in that 30-day period. The 30-day period before the indicated report date or program start date and 30 additional days following the program end date or the 4-year maximum period of admission do not count towards the maximum period of admission.",
  "(iv) Extension of stay. A program end date as indicated on the Form DS-2019 or successor form, standing alone, does not allow aliens with J status to remain in the United States in lawful status. An alien in J-1 status seeking to extend his or her stay beyond the currently authorized period of admission must apply for an extension of stay, including if a sponsor issues a Form DS-2019 or successor form extending an alien's program end date for any reason, including for a request for reinstatement, academic training, change of program, or program extension or the alien requires additional time to complete his or her program.",
  "(A) Form. To request an extension of stay, an alien in J status must file an extension of stay application on the form and in the manner designated by USCIS, including submitting the valid Form DS-2019 or successor form, appearing for any biometrics collection required by 8 CFR 103.16, and remitting the appropriate fee.",
  "(B) Timely filing. An extension of stay application is considered timely filed if the receipt date, pursuant to 8 CFR 103.2(a)(7), is on or before the date the authorized admission period expires. USCIS must receive the extension of stay application on or before the expiration of the authorized period of admission, which includes the 30-day period of preparation for departure. If the extension application is received during the 30-day period provided in paragraph (j)(1)(ii)(C) of this section following the completion of the exchange visitor program, the alien in J-1 status may continue to participate in his or her exchange visitor program.",
  "(C) Length of extensions. Subject to the restrictions in the regulations at 22 CFR part 62, extensions of stay may be granted for a period up to the length of the program, as listed on the Form DS-2019, or successor form, not to exceed 4-years, unless the J-1 exchange visitor is otherwise restricted by regulations at 22 CFR part 62. The 30-day period before the indicated report date or program start date and 30 additional days following the program end date or the maximum period of admission do not count towards the maximum length of an extension.",
  "(D) Late requests for extension of current program end date. If the responsible officer must update the program status or program end date for an exchange visitor after the program end date listed on the most recent Form DS-2019 (or its successor), the sponsor is required to submit the necessary correction or reinstatement in the manner and timeframe required by the Department of State. Once the record is corrected or reinstated, the J-1 exchange visitor must submit a request for an extension of stay to USCIS within 30 days of the status update.",
  "(E) Dependents. A J-2 spouse and unmarried children under the age of 21 seeking to accompany the J-1 exchange visitor during the additional period of admission must either be included on the primary applicant's request for extension or file their own extension of stay applications on the form designated by USCIS, including any biometrics required by 8 CFR 103.16. USCIS must receive the extension of stay applications on or before the expiration of the previously authorized period of admission, including the 30-day period following the completion of the program provided in paragraph (j)(1)(ii)(C) of this section, as indicated on the J-2 dependent's Form I-94 or successor form. J-2 dependents must demonstrate the qualifying relationship with the principal J-1 exchange visitor, be maintaining status, and not have engaged in any unauthorized employment. Extensions of stay for J-2 dependents may not exceed the authorized admission period of the principal J-1 exchange visitor.",
  "(F) Denials. If an alien's extension of stay application is denied, and the alien's authorized admission period has expired, he or she and his or her dependents must immediately depart the United States.",
  "(v) Employment of J-2 dependents. The accompanying spouse or unmarried children under the age of 21 of a J-1 exchange visitor may only engage in employment if authorized by USCIS. The employment authorization is valid only if the J-1 is maintaining status, and the J-2 employment authorization dates may not exceed the J-1 principal alien's authorized stay as indicated on Form I-94. An application for employment authorization must be filed in the manner prescribed by USCIS, together with the required fee and any additional evidence required in the filing instructions. Income from the J-2 dependent's employment may be used to support the family's customary recreational and cultural activities and related travel, among other things. Employment will not be authorized if this income is needed to support the J-1 principal exchange visitor. If the requested period of employment authorization exceeds the current admission period, the J-2 dependent must file an extension of stay application or be included in the J-1 principal's extension of stay application, in addition to the application for employment authorization, in the manner designated by USCIS, with the required fee and in accordance with form instructions.",
  "(vi) Automatic extension of J-1 authorized period of stay and grant of employment authorization for aliens who are the beneficiaries of a cap-subject H-1B petition. USCIS may, by notification in the Federal Register, at any time it determines that the H-1B numerical limitation as described in section 214(g)(1)(A) of the Act will likely be reached prior to the end of a current fiscal year, extend for such a period of time as deemed necessary to complete the adjudication of the H-1B petition, the status of any J-1 alien on behalf of whom an employer has timely filed an H-1B petition requesting change of status. The alien, in accordance with 8 CFR part 248, must not have violated the terms of his or her nonimmigrant stay and not be subject to the 2-year foreign residence requirement at section 212(e) of the Act. Any J-1 exchange visitor whose status has been extended shall be considered to be maintaining lawful nonimmigrant status for all purposes under the Act, provided that the alien does not violate the terms and conditions of his or her J nonimmigrant stay. An extension made under this paragraph (j)(1)(vi) also applies to the J-2 dependent alien.",
  "(vii) Pending extension of stay applications and employment authorization. (A) An alien whose J-1 status, as indicated on the alien's Arrival/Departure Record, Form I-94, has expired but who has timely filed an extension of stay application is authorized to continue engaging in authorized employment and activities consistent with pursuing the terms and conditions of the alien's program objectives and including authorized training, beginning on the day after the admission period expires, for a period of up to 240 days as provided in 8 CFR 274a.12(b)(20). Notwithstanding 8 CFR 274a.12(b)(20), an alien whose J-1 status, as indicated on the alien's Arrival/Departure Record, Form I-94, has expired but who has timely filed an extension of stay application on or before March 18, 2027, is authorized to continue engaging in authorized employment and activities consistent with pursuing the terms and conditions of the alien's program objectives, including authorized training and activities pursuant to a new or transferred program, while the extension of stay application is pending with USCIS, not to exceed the program end date on the Form DS-2019 (or successor form) filed with the pending application. Such authorization may be subject to any conditions and limitations of the initial authorization. If the extension of stay application remains pending beyond the Form DS-2019 (or successor form) end date filed with the application, the alien, whose status has expired, may remain in the United States and continue engaging in activities consistent with pursuing the terms and conditions of the alien's program objectives and including authorized training, but not including employment, so long as the extension of stay application is pending and he or she has filed a subsequent extension of stay request with a Form DS-2019 (or successor form) indicating an end date beyond the Form DS-2019 (or successor form) end date requested in the preceding extension of stay request. DHS reserves the discretion to extend the period permitting an alien in J-1 status to continue engaging in activities consistent with pursuing the terms and conditions of the alien's program objectives and including authorized training, up to the end date of the Form DS-2019 (or successor form) so long as the extension of stay application is pending, beyond March 18, 2027, in 6-month increments by publication of a notification in the Federal Register. Consistent with paragraph (j)(1)(iv)(E) of this section, the denial of an extension of stay application requires the alien to cease activities and depart the United States immediately.",
  "(B) The facially expired Arrival/Departure Record, Form I-94, or successor form of an alien described in paragraph (j)(1)(vii)(A) of this section is considered unexpired when combined with a USCIS receipt notice indicating receipt of a timely filed extension of stay application and a valid Form DS-2019, or successor form, indicating the duration of the program. An application is considered timely filed if the receipt notice for the application is on or before the date the admission period expires. Such extension may not exceed the earlier of 240 days, as provided in 8 CFR 274a.12(b)(20), or for those extension of stay applications filed on or before March 18, 2027, the end date of the Form DS-2019 (or successor form) filed with the application, or the date of denial of the alien's application for an extension of stay.",
  "(C) An alien in J-2 status whose admission period has expired (as indicated on his or her Form I-94) may not engage in employment until USCIS approves his or her application for employment authorization.",
  "(viii) Use of SEVIS. The use of the Student and Exchange Visitor Information System (SEVIS) is mandatory for designated program sponsors. All designated program sponsors must issue a SEVIS Form DS-2019 to any exchange visitor requiring a reportable action (e.g., program extensions and requests for employment authorization), or for any aliens who must obtain a new nonimmigrant J visa. As of 2003, the records of all current or continuing exchange visitors must be entered in SEVIS.",
  "(ix) Current name and address. A J-1 exchange visitor must inform DHS and the responsible officer of the exchange visitor program of any legal changes to his or her name or of any change of address within 10 calendar days of the change, in a manner prescribed by the program sponsor. A J-1 exchange visitor enrolled in a SEVIS program can satisfy the reporting requirement in 8 CFR 265.1 by providing a notice of a change of address within 10 calendar days to the responsible officer, who in turn shall enter the information in SEVIS within 10 business days of notification by the exchange visitor. In cases where an exchange visitor provides the sponsor a mailing address that is different than his or her actual physical address, he or she is responsible for providing the sponsor his or her actual physical location of residence. The exchange visitor program sponsor is responsible for maintaining a record of, and must provide upon request from DHS, the actual physical location where the exchange visitor resides.",
  "(6) Severability. The provisions in this paragraph (j) are intended to be independent severable parts. In the event that any provision in this paragraph (j) is not implemented, DHS intends that the remaining provisions be implemented as an independent rule.",
  "(e) Admission of aliens under section 101(a)(15)(F) and (J) previously granted duration of status. Aliens who were granted a change to F or J status prior to September 15, 2026, and who departed the United States and are applying for admission on or after September 15, 2026, will be inspected and may be admitted into the United States up to the program end date as noted on the Form I-20 or Form DS-2019 not to exceed a period of 4 years. To be admitted into the United States, all aliens must be eligible for the requested status and possess the proper documentation, including a valid passport, valid nonimmigrant visa, if required, and valid Form I-20 or Form DS-2019 or successor form.",
  "(f) Abandonment of change of status application. If an alien timely files an application to change to another nonimmigrant status but departs the United States while the application is pending, USCIS will consider the change of status application abandoned.",
  "(v) Pursuant to 8 CFR 214.2(h) is seeking H-1B nonimmigrant status and whose status and employment authorization have been extended pursuant to 8 CFR 214.2(f)(5)(vii).",
  "(10) An alien who is a foreign information media representative in I status under 8 CFR 214.2(i) may be employed pursuant to the requirements of 8 CFR 214.2(i). Employment authorization does not extend to the dependents of a foreign information media representative.",
  "(iii) Is seeking employment because of severe economic hardship pursuant to 8 CFR 214.2(f)(9)(ii)(C) and has an Employment Authorization Document, Form I-766 or successor form, based on severe economic hardship pursuant to 8 CFR 214.2(f)(9)(ii)(C), and whose timely filed application for employment authorization and application for extension of stay, both filed on applicable forms and in the manner designated by USCIS, with the required fees, as described in the form's instructions, are pending, is authorized to engage in employment beginning on the expiration date of the Employment Authorization Document issued under paragraph (c)(3)(i)(B) of this section and ending on the date of USCIS' written decision on the current Application for Employment Authorization, Form I-765, or successor form, but not to exceed 240 days. For this same period, such Employment Authorization Document, Form I-766 or successor form, is automatically extended and is considered unexpired when combined with a Certificate of Eligibility for Nonimmigrant (F-1/M-1) Students, Form I-20 or successor form, endorsed by the Designated School Official recommending such an extension.",
